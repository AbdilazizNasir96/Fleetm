components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    # ─── AUTH ───
    RegisterBody:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
        fullName:
          type: string
        tenantName:
          type: string
        tenantSlug:
          type: string
      required:
        - email
        - password
        - fullName
        - tenantName
        - tenantSlug

    LoginBody:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password

    SwitchTenantBody:
      type: object
      properties:
        tenantId:
          type: string
      required:
        - tenantId

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/UserProfile"
        tenant:
          $ref: "#/components/schemas/Tenant"
        role:
          type: string
      required:
        - token
        - user
        - tenant
        - role

    UserProfile:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        fullName:
          type: ["string", "null"]
        isActive:
          type: boolean
        isSuperAdmin:
          type: boolean
        createdAt:
          type: ["string", "null"]
      required:
        - id
        - email
        - isActive
        - isSuperAdmin

    MeResponse:
      type: object
